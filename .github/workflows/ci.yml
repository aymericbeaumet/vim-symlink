on: [push, pull_request]

name: ci

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: jdx/mise-action@v5.1.2
        with:
          version: '2026.10.10'

      - name: lint
        run: make lint

      - name: test-vim
        run: make test-vim

      - name: test-nvim
        run: make test-nvim

  compatibility:
    name: compatibility (${{ matrix.editor }} ${{ matrix.version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: Vim
            version: v8.2.3995
            neovim: false
            target: test-vim
          - editor: Neovim
            version: v0.6.1
            neovim: true
            target: test-nvim

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: install ${{ matrix.editor }} ${{ matrix.version }}
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: ${{ matrix.neovim }}
          version: ${{ matrix.version }}

      - name: test ${{ matrix.editor }} ${{ matrix.version }}
        run: make ${{ matrix.target }}
