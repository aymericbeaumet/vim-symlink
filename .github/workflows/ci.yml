on:
  push:
    branches: [main]
  pull_request:

name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: '2026.10.13'

      - name: lint
        run: make lint

      - name: test-vim
        run: make test-vim

      - name: test-nvim
        run: make test-nvim

  compatibility:
    name: compatibility (${{ matrix.editor }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENV: compat

    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: Vim
            version: v8.2.3995
            tool: asdf:mise-plugins/mise-vim
            target: test-vim
          - editor: Neovim
            version: v0.6.1
            tool: aqua:neovim/neovim
            target: test-nvim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: '2026.10.13'
          install_args: ${{ matrix.tool }}

      - name: test ${{ matrix.editor }} ${{ matrix.version }}
        run: make ${{ matrix.target }}
