on: [push, pull_request]

name: ci

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: jdx/mise-action@v5.1.2
        with:
          version: '2026.10.11'

      - name: lint
        run: make lint

      - name: test-vim
        run: make test-vim

      - name: test-nvim
        run: make test-nvim

  compatibility:
    name: compatibility (${{ matrix.editor }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    env:
      MISE_ENV: compat

    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: Vim
            version: v8.2.3995
            tool: asdf:mise-plugins/mise-vim
            target: test-vim
          - editor: Neovim
            version: v0.6.1
            tool: aqua:neovim/neovim
            target: test-nvim

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: jdx/mise-action@v5.1.2
        with:
          version: '2026.10.11'
          install_args: ${{ matrix.tool }}

      - name: test ${{ matrix.editor }} ${{ matrix.version }}
        run: make ${{ matrix.target }}
